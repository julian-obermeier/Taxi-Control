name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
      - name: Database and seed smoke test
        run: php artisan migrate:fresh --seed --force
      - name: Route smoke test
        run: |
          php artisan route:list
          php artisan route:cache
          php artisan route:clear
      - name: Compile Blade views
        run: php artisan view:cache
      - name: Run tests
        run: php artisan test

  mysql-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: taxi_control_test
          MYSQL_USER: taxi
          MYSQL_PASSWORD: taxi_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: taxi_control_test
      DB_USERNAME: taxi
      DB_PASSWORD: taxi_test_password
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_mysql, zip
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: cp .env.example .env
      - name: MySQL migration and seed smoke test
        run: php artisan migrate:fresh --seed --force
      - name: Route cache smoke test
        run: |
          php artisan route:cache
          php artisan route:clear
      - name: Run critical tests on MySQL
        run: php artisan test --testsuite=Feature
